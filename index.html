<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSTM Energy Forecasting</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans leading-normal tracking-normal">
    <div class="container mx-auto px-4 py-12 max-w-4xl">
        
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2">
                PJM Energy Consumption Forecast
            </h1>
            <p class="text-gray-600">LSTM Neural Network Analysis</p>
        </header>

        

        <div class="bg-white rounded-xl shadow-md p-8 border border-gray-200 text-center">
    <label class="block text-sm font-medium text-gray-700 mb-4">
        Select Date and Time for Prediction:
    </label>
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <input type="date" id="forecast-date" name="forecast-date"min="2020-01-01"max="2026-07-01"
               class="w-full sm:w-auto px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">

        <select id="forecast-time" name="forecast-time" 
                class="w-full sm:w-auto px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option value="0:00">0:00</option>
            <option value="1:00">1:00</option>
            <option value="2:00">2:00</option>
            <option value="3:00">3:00</option>
            <option value="4:00">4:00</option>
            <option value="5:00">5:00</option>
            <option value="6:00">6:00</option>
            <option value="7:00">7:00</option>
            <option value="8:00">8:00</option>
            <option value="9:00">9:00</option>
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="12:00">12:00</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
            <option value="15:00">15:00</option>
            <option value="16:00">16:00</option>
            <option value="17:00">17:00</option>
            <option value="18:00">18:00</option>
            <option value="19:00">19:00</option>
            <option value="20:00">20:00</option>
            <option value="21:00">21:00</option>
            <option value="22:00">22:00</option>
            <option value="23:00">23:00</option>
        </select>
    </div>
    
    <div class="mt-4">
        <button id="run-forecast-btn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-8 rounded-lg shadow transition-colors">
            Run Forecast
        </button>
    </div>

    
    <br><br>
    <label class="block text-sm font-medium text-gray-700 mb-4">
        Predicted Energy Usage:
    </label>
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <input id="prediction-output" input type="text" id="disabled-input-2" value="XXXXXXXXXX" 
            class="w-full sm:w-auto px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" disabled readonly>
    </div>
    

<br><br><br><br>

<!--This div creates a new plotly html file which displays data gathered in 2010-->

<div class="bg-white rounded-xl shadow-md overflow-hidden mb-8 border border-gray-200">
            <div class="p-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-4 text-center">Energy Use for Year 2010</h2>
                <div class="aspect-video bg-gray-100 rounded-lg overflow-hidden border border-gray-200">
                    <iframe src="plot_2010.html" class="w-full h-full border-none"></iframe>
                </div>
            </div>
</div>

</div>
        <footer class="mt-12 text-center text-gray-500 text-sm">
            <p>Macsen Higgins &bull; Jacob Southern</p>
        </footer>
</div>


<!--Basic javascript that saves the data from the input boxes-->
<script>
    // 1. Listen for the button click
    document.getElementById('run-forecast-btn').addEventListener('click', function() {
        
        // 2. Extract values from the UI
        const selectedDate = document.getElementById('forecast-date').value;
        const selectedTime = document.getElementById('forecast-time').value;

        //ensures the user actually picked a date
        if (!selectedDate) {
            alert("Please select a date first!");
            return;
        }

        // 3. Format the string (Normalization)
            // Turns "2010-05-01" + "1:00" into "2010-05-01 01:00:00"
            const formattedTime = selectedTime.padStart(5, '0') + ":00";
            const finalDateTime = `${selectedDate} ${formattedTime}`;

            // 4. Output to the readonly textbox
            const outputBox = document.getElementById('prediction-output');
            outputBox.value = finalDateTime;
            
            console.log("UI updated with:", finalDateTime);
    });



        
</script>



</body>
</html>
