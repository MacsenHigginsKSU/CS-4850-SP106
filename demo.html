<!--Basic javascript that saves the data from the input boxes-->
<script>
    // 1. Listen for the button click
    document.getElementById('run-forecast-btn').addEventListener('click', async function() {
        
        // 2. Extract values from the UI
        const selectedDate = document.getElementById('forecast-date').value;
        const selectedTime = document.getElementById('forecast-time').value;

        //ensures the user actually picked a date
        if (!selectedDate) {
            alert("Please select a date first!");
            return;
        }

        // 3. Format the string (Normalization)
            // Turns "2010-05-01" + "1:00" into "2010-05-01 01:00:00"
            const formattedTime = selectedTime.padStart(5, '0') + ":00";
            const finalDateTime = `${selectedDate} ${formattedTime}`;

            // 4. Output to the readonly textbox
            const outputBox = document.getElementById('prediction-output');

            try {
                const response = await fetch('user_datetime_predictions.csv')
                const csvText = await response.text();

                const rows = csvText.split('\n');
                const headers = rows[0].split(',');

                const matchingRow = rows.find(row => row.startsWith(finalDateTime));

                if (matchingRow) {
                    const columns = matchingRow.split(',');
                    const predictionValue = columns[1];

                    outputBox.value = `${predictionValue} MWh`;
                    console.log("Found prediction:", predictionValue);
                } else {
                    outputBox.value = "No data found for this time.";
                    console.warn("Timestamp not found in CSV:", finalDateTime);
                }

            } catch (error) {
                console.error("Error loading CSV:", error);
                alert("Could not load the prediction data.");
            }
            
            //console.log("UI updated with:", finalDateTime);
    });



        
</script>
